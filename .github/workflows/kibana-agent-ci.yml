# Lightweight CI for the agent-factory POC fork (M1.c).
# Conventional GitHub Actions only — no internal endpoints or secrets.

name: Kibana Agent Factory (fork CI)

on:
  pull_request:
    branches:
      - poc/agent-factory
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: kibana-agent-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    name: Bootstrap, typecheck, eslint (scoped)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: 'true'
      # Bootstrap and TS can exceed default heap on ubuntu-latest.
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node (from .nvmrc)
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Enable Yarn classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Install and link (kbn bootstrap)
        run: yarn kbn bootstrap --no-prebuilt

      - name: Type check @kbn/repo-info
        run: node scripts/type_check --project src/platform/packages/shared/kbn-repo-info/tsconfig.json

      - name: ESLint @kbn/repo-info sources
        run: node scripts/eslint.js src/platform/packages/shared/kbn-repo-info

  ci-results-comment:
    name: Post CI results comment
    runs-on: ubuntu-latest
    needs: [verify]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Post CI results
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const buildNumber = context.runNumber;
            const buildUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commit = context.payload.pull_request.head.sha;
            const verifyResult = '${{ needs.verify.result }}';

            let emoji, title, state, success;
            if (verifyResult === 'success') {
              emoji = ':green_heart:';
              title = 'Build Succeeded';
              state = 'passed';
              success = true;
            } else if (verifyResult === 'cancelled') {
              return;
            } else {
              emoji = ':broken_heart:';
              title = 'Build Failed';
              state = 'failed';
              success = false;
            }

            const failedSteps = [];
            if (!success) {
              failedSteps.push(`* [Bootstrap, typecheck, eslint](${buildUrl})`);
            }

            let body = `## ${emoji} ${title}\n`;
            body += `* [GitHub Actions Build](${buildUrl})\n`;
            body += `* Commit: ${commit}\n`;
            if (failedSteps.length > 0) {
              body += `\n### Failed CI Steps\n${failedSteps.join('\n')}\n`;
            }
            body += `\n<!--buildkite-pr-comment-kibana-pull-request\n`;
            body += JSON.stringify({
              builds: [{
                buildStatus: { state, success, hasRetries: false, hasNonPreemptionRetries: false },
                url: buildUrl,
                number: buildNumber,
                commit
              }],
              number: buildNumber
            });
            body += `\nbuildkite-pr-comment-->\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('buildkite-pr-comment-kibana-pull-request')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
